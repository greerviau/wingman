# config.example.toml - template for wingman's settings file.
#
# Copy this to config.local.toml (gitignored) and uncomment what you want:
#   cp config.example.toml config.local.toml
#
# Everything here is optional. With no file at all, wingman asks the
# onboarding-preference questions once per run, and every spawn falls through
# to the agent CLI's own model.
#
# Precedence, most specific first:
#   an explicit flag (--model, --effort, --agent, ...)
#     > a per-crew-type entry in this file ([models], [effort], [harness.agent])
#     > the matching $WM_* environment variable
#     > this file's own `default` key (which is exported as that same variable)
#     > wingman's built-in default
# `bin/config` prints every resolved setting with the source it came from.
#
# Validate the file with `bin/doctor` (or `bin/config --check`).


# --- Onboarding preferences --------------------------------------------------
# The questions wingman would otherwise ask at the start of every run. Answer a
# key here and it is never asked again; leave one out and wingman asks that one
# (only that one) as usual. An answer given interactively during a run - via
# /prefs - wins over this file for the rest of that run.
#
# The keys and their accepted values are defined in hooks/lib/pilot-prefs.sh.
[prefs]
# Are you watching the session locally, or over Remote Control? `true` also
# switches every URL wingman surfaces to a markdown link.
# remote = false

# Should markdown deliverables (plans, reports) also be published as a hosted
# Artifact link, or is the local file path enough?  "artifact" | "local"
# artifact_linking = "local"

# How much should wingman narrate its own reasoning and routing?
#   "concise" | "detailed"
# verbosity = "concise"

# For work you spawn directly (not through a lead), see each round of a revise
# loop, or just the terminal outcome?  "each-round" | "summary-only"
# direct_spawn_visibility = "each-round"

# May crew write to GitHub PRs (reviews, thread replies, provenance markers), or
# does all inter-agent review feedback stay on wingman's own channel?
#   "on" | "off"
# pr_comments = "off"


# --- Models ------------------------------------------------------------------
# `default` applies to every spawn. Any other key names a crew type and applies
# to that type only - more specific wins. Use the bare role name
# ("developer") or the category-qualified one ("software-development/developer")
# to break a collision; see `bin/spawn-crew --list-types`.
# An explicit `--model` on a spawn always wins over both.
[models]
# default = "opus"
# developer = "sonnet"
# research = "haiku"
# "software-development/reviewer" = "opus"


# --- Reasoning effort --------------------------------------------------------
# Same shape and same precedence as [models], for --effort.
#   "low" | "medium" | "high" | "xhigh" | "max"
[effort]
# default = "high"
# research = "low"


# --- Project discovery -------------------------------------------------------
# What bin/discover-projects scans. ~ and $VARs are expanded.
[projects]
# Extra roots to scan, beyond wingman's own parent directory.
# roots = ["~/dev", "~/code"]

# Project names to skip.
# ignore = ["some-repo-to-skip"]

# Pin a project name to an explicit path, overriding anything the scan finds.
# [projects.pins]
# my-app = "~/dev/my-app"


# --- Harness -----------------------------------------------------------------
# The agent-CLI-specific knobs. Change these to point the crew layer at a
# different harness, or to loosen/tighten how crew sessions launch.
[harness]
# The agent CLI a crew session execs - claude (the default), or any other
# name with a descriptor at bin/lib/agents/<name>.sh. `[harness.agent]` below
# is the per-crew-type form of this SAME setting (its own `default` key
# covers the plain fleet-wide case too) - set one shape or the other, never
# both: TOML rejects a file that defines `harness.agent` as both a scalar
# here and a table there.
# agent = "claude"

# Per-crew-type agent CLI, exactly like [models]/[effort] above: `default`
# applies to every spawn, any other key names a crew type. An explicit
# --agent on a spawn always wins over both this and the plain `agent` scalar
# above.
#[harness.agent]
#default = "claude"
#developer = "codex"
#"software-development/reviewer" = "claude"

# --permission-mode for a crew session. Crew run unattended, so the default
# keeps a gated tool call from hanging forever on a prompt nobody will answer.
# Set to "" to disable and fall back to interactive prompting.
# permission_mode = "bypassPermissions"

# Launch crew Remote-Control-visible, so you can reach a member from
# claude.ai/code and not only via tmux attach.
# remote_control = true

# The tmux session that hosts crew windows.
# tmux_session = "wingman"


# --- Everything else ---------------------------------------------------------
# Wingman has around a hundred more WM_* variables - internal timings,
# thresholds, and the pane-detector regexes - each documented at its point of
# use. They are for the rare case of tuning wingman's own internals, so they get
# no typed home above; set one here and it is exported verbatim.
#
# Values are strings. Only WM_-prefixed names are accepted, and a name one of the
# settings above already owns is rejected (set `models.default`, not
# `env.WM_MODEL`) - `bin/config --check` says which. Grep the source for '${WM_'
# to find them all.
[env]
# Seconds between watcher polls.
# WM_WATCH_INTERVAL = "5"

# Seconds an apparently-idle crew member goes unheard before the watcher nudges
# it, and then flips it to `stalled`.
# WM_STALL_IDLE = "180"

# Bounded retries for the stall self-heal nudge (issue #236): how many
# composer-leaving attempts (typed and Enter pressed, submit never confirmed)
# the watcher makes before giving up and escalating with an "unconfirmed"
# reason instead of retrying forever. 0 still sends one attempt before giving
# up, not zero attempts.
# WM_STALL_NUDGE_TRIES = "2"

# Seconds before a stall nudge marker is treated as belonging to a concluded
# episode and reaped, so it can never gate a later, unrelated episode. Derived
# by default as WM_STALL_IDLE * (WM_STALL_NUDGE_TRIES + 2) (720 at defaults);
# must stay above 2x WM_STALL_IDLE, or the flip window can collapse (PR
# #101) - a lower value is warned about and clamped up to that floor.
# WM_STALL_NUDGE_TTL = "720"

# Seconds a member's pane must repaint continuously (never idle at a prompt)
# while its own record goes unwritten and a watch-fleet/pr-watch descendant
# runs, before it flips to `stalled` as a wedged foreground watcher (issue
# #202). Not independent of WM_WEDGE_PANE_GAP below - preserve the ratio
# between them if you retune either.
# WM_WEDGE_SECS = "1800"

# Seconds of pane silence that resets the above anchor - a healthy pane's own
# longest continuously-live run saturates just past this value.
# WM_WEDGE_PANE_GAP = "60"

# Regex matched against a candidate descendant's own command line to decide
# whether it counts as "this member's own watch-fleet/pr-watch call" for the
# wedge check above. Widen it to catch a wedge on some other unbounded
# foreground call if one is ever observed in practice.
# WM_WEDGE_PROC_RE = "watch-fleet|pr-watch"

# Seconds between a crew window opening and its first message being delivered.
# WM_SPAWN_DELAY = "2"
