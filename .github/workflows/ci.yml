name: CI

on:
  push:
    branches: [main]
  # No branches: filter here (issue #25) - a stacked PR (one feature's own
  # multi-stage effort, each PR based on the previous stage's still-unmerged
  # branch rather than main) would otherwise never get a CI run at all, since
  # pull_request's own branches: filter matches the PR's BASE ref, not just
  # the special case of main. Every PR gets a real run regardless of what
  # it's opened against; push above stays scoped to main only, unchanged.
  pull_request:

# One in-flight run per ref; a new push supersedes the previous run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint bash scripts (errors only)
        run: |
          # Discover every bash script by shebang: bin/ and hooks/ hold
          # extensionless executables, tests/ holds *.test.sh. Python helpers
          # under bin/lib are skipped by the bash-shebang filter.
          mapfile -t files < <(grep -rlE '^#!.*\bbash\b' bin hooks tests | sort -u)
          printf 'Linting %d file(s):\n' "${#files[@]}"
          printf '  %s\n' "${files[@]}"
          # -S error: only genuine errors fail CI; style/info/warning findings do
          # not, keeping this a low-friction gate over pre-existing scripts.
          # -e SC1091: do not fail on unfollowable `source` of sibling libs.
          shellcheck -S error -e SC1091 "${files[@]}"

      - name: Lint sourced bash libraries (errors only)
        run: |
          # A library meant to be sourced carries no shebang, so the discovery
          # above cannot see it - which silently exempted bin/lib/common.sh, the
          # most widely shared file in the repo, and let a malformed shellcheck
          # directive in it go unnoticed (a parse error there stops the linter
          # analyzing everything after it). Linted explicitly, with the dialect
          # stated since there is no shebang to infer it from.
          mapfile -t libs < <(
            for f in bin/lib/*.sh hooks/lib/*.sh; do
              [ -e "$f" ] || continue
              head -1 "$f" | grep -q '^#!' || printf '%s\n' "$f"
            done | sort -u
          )
          printf 'Linting %d sourced lib(s):\n' "${#libs[@]}"
          printf '  %s\n' "${libs[@]}"
          shellcheck -S error -e SC1091 -s bash "${libs[@]}"

  test:
    name: test
    runs-on: ubuntu-latest
    # Outer backstop: even if the bounded suite timeout below is bypassed, the
    # job can never run away.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install tmux
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Show toolchain
        run: |
          bash --version | head -1
          git --version
          tmux -V
          uv --version

      - name: Run test suite (bounded)
        env:
          # CI runners are ephemeral and always start clean, so run.sh's
          # post-loop sweep (scoped to this run's own WM_TEST_RUN_ID token)
          # having to reap anything at all means this run leaked past its own
          # traps - a real regression, not an already-dirty box's unrelated
          # residue. Local runs default this off (see tests/run.sh).
          WM_TEST_STRICT_LEAK_CHECK: "1"
        run: |
          # The suite drives bin/watch-fleet and real tmux windows. A watcher
          # that fails to exit would otherwise block the job indefinitely, so
          # wrap the whole suite in a hard timeout (SIGTERM at 1320s, SIGKILL
          # 30s later). A genuine hang is unbounded, so any finite cap catches
          # it; 1320s sits well above the suite's real wall-clock runtime
          # (tests/run.sh runs files concurrently, so watch-fleet and
          # stall-check's own deliberate sleeps overlap with everything else
          # rather than adding to it) so a slow but healthy run is never cut
          # off. run.sh exits non-zero on any failing suite; timeout exits
          # 124/137 if it has to intervene. Either fails the job.
          timeout --kill-after=30s 1320 bash tests/run.sh

  # Single aggregate gate: green only when both jobs pass. Mark this check
  # ("ci") as required in the branch-protection rules for main so a PR cannot
  # merge unless the suite and the linter both pass.
  ci:
    name: ci
    runs-on: ubuntu-latest
    needs: [shellcheck, test]
    if: always()
    steps:
      - name: Verify required jobs succeeded
        run: |
          echo "shellcheck: ${{ needs.shellcheck.result }}"
          echo "test:       ${{ needs.test.result }}"
          if [ "${{ needs.shellcheck.result }}" != "success" ] || \
             [ "${{ needs.test.result }}" != "success" ]; then
            echo "::error::A required CI job did not succeed."
            exit 1
          fi
          echo "All required CI jobs succeeded."
